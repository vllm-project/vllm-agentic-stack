[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/vllm-project/agentic-api"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
agentic-core = { package = "agentic-server-core", path = "crates/agentic-server-core", version = "0.7.0" }
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
either = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
criterion = { version = "0.5", features = ["async_tokio"] }
dirs = "6"
futures = "0.3"
indexmap = "2"
http = "1"
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["rust_crypto"] }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false }
rmcp-reqwest = { package = "reqwest", version = "0.13.2", default-features = false, features = ["json", "stream", "rustls"] }
rmcp = { version = "1.8", default-features = false }
serde = { version = "1", features = ["derive"] }
# Structured Outputs emit object keys in JSON Schema declaration order.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sse-stream = "0.2.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
tokio-tungstenite = "0.29"
url = "2"
utoipa = { version = "5", features = ["chrono", "uuid"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
